name: i.hyper.smac CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', 3.11]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gfortran \
          libnetcdf-dev \
          libhdf5-dev \
          libgdal-dev \
          libproj-dev \
          libgeos-dev \
          libjson-c-dev \
          libopenjp2-7-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          liblzma-dev \
          libzstd-dev \
          libopencl-dev \
          ocl-icd-opencl-dev \
          clinfo
    
    - name: Install libRadtran
      run: |
        wget https://www.libradtran.org/download/libRadtran-2.0.4.tar.gz
        tar xzf libRadtran-2.0.4.tar.gz
        cd libRadtran-2.0.4
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        cd ..
        sudo ldconfig
    
    - name: Install GRASS GIS
      run: |
        sudo apt-get install -y grass grass-dev grass-doc
        export GISBASE=/usr/lib/grass
        export PATH=$GISBASE/bin:$GISBASE/scripts:$PATH
        export LD_LIBRARY_PATH=$GISBASE/lib:$LD_LIBRARY_PATH
        export PYTHONPATH=$GISBASE/etc/python:$PYTHONPATH
        grass --version
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          numpy \
          scipy \
          netcdf4 \
          h5py \
          pyopencl \
          coverage \
          pytest \
          pytest-cov
    
    - name: Configure environment
      run: |
        export GISBASE=/usr/lib/grass
        export PATH=$GISBASE/bin:$GISBASE/scripts:$PATH
        export LD_LIBRARY_PATH=$GISBASE/lib:$LD_LIBRARY_PATH
        export PYTHONPATH=$GISBASE/etc/python:$PYTHONPATH
        export LIBRADTRAN_PATH=/usr/local
        export GRASS_VERBOSE=3
        
        # Test OpenCL availability
        clinfo || echo "OpenCL not available, will use CPU fallback"
    
    - name: Build and install i.hyper.smac
      run: |
        export GISBASE=/usr/lib/grass
        export PATH=$GISBASE/bin:$GISBASE/scripts:$PATH
        export LD_LIBRARY_PATH=$GISBASE/lib:$LD_LIBRARY_PATH
        export PYTHONPATH=$GISBASE/etc/python:$PYTHONPATH
        
        make clean
        make install
        make test
    
    - name: Run unit tests
      run: |
        export GISBASE=/usr/lib/grass
        export PATH=$GISBASE/bin:$GISBASE/scripts:$PATH
        export LD_LIBRARY_PATH=$GISBASE/lib:$LD_LIBRARY_PATH
        export PYTHONPATH=$GISBASE/etc/python:$PYTHONPATH
        export GRASS_VERBOSE=2
        
        cd testsuite
        python run_tests.py --unit-only --verbose
    
    - name: Run integration tests
      run: |
        export GISBASE=/usr/lib/grass
        export PATH=$GISBASE/bin:$GISBASE/scripts:$PATH
        export LD_LIBRARY_PATH=$GISBASE/lib:$LD_LIBRARY_PATH
        export PYTHONPATH=$GISBASE/etc/python:$PYTHONPATH
        export GRASS_VERBOSE=2
        
        cd testsuite
        python run_tests.py --integration-only --verbose
    
    - name: Run performance tests
      run: |
        export GISBASE=/usr/lib/grass
        export PATH=$GISBASE/bin:$GISBASE/scripts:$PATH
        export LD_LIBRARY_PATH=$GISBASE/lib:$LD_LIBRARY_PATH
        export PYTHONPATH=$GISBASE/etc/python:$PYTHONPATH
        export GRASS_VERBOSE=1
        
        cd testsuite
        python run_tests.py --performance-only
    
    - name: Generate test coverage
      run: |
        export GISBASE=/usr/lib/grass
        export PATH=$GISBASE/bin:$GISBASE/scripts:$PATH
        export LD_LIBRARY_PATH=$GISBASE/lib:$LD_LIBRARY_PATH
        export PYTHONPATH=$GISBASE/etc/python:$PYTHONPATH
        
        cd testsuite
        python -m coverage run run_tests.py --unit-only
        python -m coverage xml
        python -m coverage html
        
        # Upload coverage to Codecov
        bash <(curl -s https://codecov.io/bash) -f coverage.xml
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: |
          testsuite/test_report.html
          testsuite/coverage.xml
          testsuite/htmlcov/
    
    - name: Check documentation
      run: |
        # Verify documentation can be generated
        ls -la *.html *.md || echo "No documentation files found"
        
        # Test module help
        export GISBASE=/usr/lib/grass
        export PATH=$GISBASE/bin:$GISBASE/scripts:$PATH
        export LD_LIBRARY_PATH=$GISBASE/lib:$LD_LIBRARY_PATH
        export PYTHONPATH=$GISBASE/etc/python:$PYTHONPATH
        
        grass --tmp-location EPSG:4326 --exec "i.hyper.smac --help" || echo "Help test failed"

  build-docs:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz
    
    - name: Generate documentation
      run: |
        # Generate Doxygen documentation
        doxygen i_hyper_smac.dox || echo "Doxygen documentation generation completed"
        
        # List generated files
        find . -name "*.html" -o -name "*.md" | head -10
    
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: |
          docs/
          *.html
          *.md

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run security scan
      run: |
        # Bandit security linter
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . || true
        
        # Safety check for known vulnerabilities
        safety check --json --output safety-report.json || true
        safety check || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  code-quality:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install code quality tools
      run: |
        python -m pip install --upgrade pip
        pip install \
          flake8 \
          pylint \
          black \
          isort \
          mypy \
          pytest
    
    - name: Run code quality checks
      run: |
        # Flake8 linting
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
        
        # Black formatting check
        black --check --diff . || true
        
        # Import sorting check
        isort --check-only --diff . || true
        
        # Pylint analysis
        pylint **/*.py --output-format=json > pylint-report.json || true
        
        # MyPy type checking (if type hints available)
        mypy --ignore-missing-imports . || true
    
    - name: Upload quality reports
      uses: actions/upload-artifact@v3
      with:
        name: code-quality-reports
        path: |
          pylint-report.json
